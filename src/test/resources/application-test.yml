spring:
  application:
    name: wallet-api-test
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  private-key-path: keys/private.pem
  public-key-path: keys/public.pem
  key-id: wallet-dev-1
  issuer: wallet-api
  audience: portfolio
  access-token-expiration-seconds: 900
  refresh-token-expiration-days: 7

cors:
  allowed-origins:
    - http://localhost:5173
    - http://localhost:8088
