spring:
  application:
    name: wallet-api
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/wallet_db}
    username: ${SPRING_DATASOURCE_USERNAME:wallet}
    password: ${SPRING_DATASOURCE_PASSWORD:wallet_secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 2000ms
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:wallet}
    password: ${SPRING_RABBITMQ_PASSWORD:wallet_secret}
    publisher-confirm-type: correlated
    publisher-returns: true

server:
  port: 8080

jwt:
  private-key-path: ${JWT_PRIVATE_KEY_PATH:keys/private.pem}
  public-key-path: ${JWT_PUBLIC_KEY_PATH:keys/public.pem}
  key-id: wallet-dev-1
  issuer: wallet-api
  audience: portfolio
  access-token-expiration-seconds: 900
  refresh-token-expiration-days: 7

cors:
  allowed-origins:
    - http://localhost:5173
    - http://localhost:8088

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    distribution:
      percentiles-histogram:
        http.server.requests: true

logging:
  pattern:
    level: "%5p"
